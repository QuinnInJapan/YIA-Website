      :root {

        --band: #eef4ef;
        --fixed: #0f6b45;
        --blocked: #9a3412;
        --partial: #7c5b00;
        --ok: #315a86;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }
      header {
        padding: 28px 32px 20px;
        border-bottom: 1px solid var(--line);
        background: white;
      }
      h1 {
        margin: 0 0 6px;
        font-size: clamp(24px, 3vw, 34px);
        letter-spacing: 0;
      }
      .meta {
        color: var(--muted);
        margin: 0;
      }
      main {
        padding: 24px 32px 40px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 18px;
      }
      .stat {
        border: 1px solid var(--line);
        background: white;
        border-radius: 8px;
        padding: 12px 14px;
      }
      .stat strong {
        display: block;
        font-size: 26px;
        line-height: 1;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        margin: 0 0 14px;
      }
      input,
      select {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: white;
        padding: 8px 10px;
        font: inherit;
      }
      input {
        min-width: min(420px, 100%);
        flex: 1;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border: 1px solid var(--line);
      }
      th,
      td {
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        text-align: left;
      }
      th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--band);
        font-size: 13px;
        color: #33413b;
      }
      td:first-child {
        width: 72px;
        color: var(--muted);
      }
      .area {
        width: 150px;
        color: var(--muted);
      }
      .request {
        min-width: 240px;
      }
      .fix {
        min-width: 300px;
      }
      .badge {
        display: inline-block;
        min-width: 82px;
        border-radius: 999px;
        padding: 3px 9px;
        color: white;
        font-size: 12px;
        text-align: center;
        white-space: nowrap;
      }
      .Fixed {
        background: var(--fixed);
      }
      .Blocked {
        background: var(--blocked);
      }
      .Partial {
        background: var(--partial);
      }
      .Already {
        background: var(--ok);
      }
      @media (max-width: 760px) {
        header,
        main {
          padding-left: 16px;
          padding-right: 16px;
        }
        table,
        thead,
        tbody,
        tr,
        th,
        td {
          display: block;
        }
        thead {
          display: none;
        }
        tr {
          border-bottom: 1px solid var(--line);
        }
        td {
          border-bottom: 0;
          padding: 6px 12px;
        }
        td::before {
          content: attr(data-label);
          display: block;
          color: var(--muted);
          font-size: 12px;
          margin-bottom: 2px;
        }
        td:first-child,
        .area {
          width: auto;
        }
      }
    </style>

      ];

      const labels = ["Fixed", "Partial", "Blocked", "Already OK"];
      const stats = document.getElementById("stats");
      const tbody = document.getElementById("rows");
      const search = document.getElementById("search");
      const status = document.getElementById("status");

      function renderStats(items) {
        stats.innerHTML = "";
        for (const label of labels) {
          const count = items.filter((item) => item[3] === label).length;
          const div = document.createElement("div");
          div.className = "stat";
          div.innerHTML = `<strong>${count}</strong><span>${label}</span>`;
          stats.appendChild(div);
        }
        const total = document.createElement("div");
        total.className = "stat";
        total.innerHTML = `<strong>${items.length}</strong><span>Total TODOs</span>`;
        stats.appendChild(total);
      }

      function renderRows() {
        const q = search.value.trim().toLowerCase();
        const selected = status.value;
        const filtered = todos.filter((item) => {
          const haystack = item.join(" ").toLowerCase();
          return (!selected || item[3] === selected) && (!q || haystack.includes(q));
        });
        renderStats(filtered);
        tbody.innerHTML = "";
        for (const item of filtered) {
          const tr = document.createElement("tr");
          const labels = ["ID", "Area", "TODO from feedback", "Status", "Exactly how handled"];
          item.forEach((value, index) => {
            const td = document.createElement("td");
            td.dataset.label = labels[index];
            if (index === 3) {
              const badge = document.createElement("span");
              badge.className = `badge ${value.split(" ")[0]}`;
              badge.textContent = value;
              td.appendChild(badge);
            } else {
              td.textContent = value;
            }
            if (index === 1) td.className = "area";
            if (index === 2) td.className = "request";
            if (index === 4) td.className = "fix";
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        }
      }

      search.addEventListener("input", renderRows);
      status.addEventListener("change", renderRows);
      renderRows();
    </script>
  </body>
</html>
